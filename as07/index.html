	<body>
	<div class="hero" style="background:khaki;">
		<div class="caption-container">
                <p class="caption">沒有禁行機車的世界，<br>是什麼樣子的？</p>
            </div>
	</div>

	<div style="height:300vh">
		<div id="outer" class="sticky-top">
			<div id="statusbar" style="height:100vh"></div>
		</div>
	</div>
	
	<div class="banner bg-info text-center">
		<div class="caption-container">
                <p class="caption">讓我們看看人本交通的故事</p>
            </div>
	</div>

	<div class="scroll-container">
		<div class="horizontal-section">
			<div class="horizontal-item" style="background-image: url(story/1.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/2.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/3.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/4.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/5.png); background-size: cover;"></div>
		</div>
	</div>

	<div class="vh-100 bg-dark text-center">覺得這樣的世界很美好，<br>對嗎？</div>
	<div class="vh-100 bg-warning text-center">然而，台灣仍面對過時的車種管制法規、<br>二輪車種欠友善的道路環境。</div>
	<div class="vh-100 bg-info text-center">那麼，我們可以怎麼做呢？</div>
	<div class="scroll-container-reverse">
		<div class="horizontal-section-reverse">
			<div class="horizontal-item" style="background-image: url(story/10.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/9.jpg); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/8.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/7.png); background-size: cover;"></div>
			<div class="horizontal-item" style="background-image: url(story/6.png); background-size: cover;"></div>
		</div>
	</div>

	<div class="vh-100 bg-dark text-center">2025年1-7月，台灣已有<b>1,579</b>人死於道路交通事故。</div>
	<div class="vh-100 bg-secondary text-center">讓我們一起行動，讓台灣早日全面邁入人本交通時代。</div>
	<div class="vh-100 bg-info text-center">本網頁大部分圖片由Google Nano Banana模型生成，<br>另有兩張擷取自Google地圖街景、一張為作者本人所拍攝。</div>
